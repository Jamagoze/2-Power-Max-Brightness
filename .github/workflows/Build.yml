name: Build Power Max Light

on:
  push:
    branches: [ main, master ]
    paths:
      - powermaxlight.zip
      - .github/workflows/build.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source zip
        run: |
          rm -rf project
          mkdir project
          unzip -q powermaxlight.zip -d project
          # handle a zip that has a single top-level folder
          ROOT=$(dirname "$(find project -maxdepth 2 -name settings.gradle | head -n 1)")
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp "$PROJECT_DIR"/app/build/outputs/apk/release/*.apk out/PowerMaxLight.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PowerMaxLight
          path: out/PowerMaxLight.apk
